description: Khi chủ yêu cầu, AI Việt Côn hay một trợ lý tự sửa chính nó và brain (trợ lý, skill, workflow, vòng lặp, bộ nhớ) có sao lưu và hoàn tác, sửa mã nguồn AI Việt Côn qua GitHub, rồi tự cập nhật lên bản mới. Chỉ phiên của chủ thấy tool này.
description_en: "On the owner's request, AI Việt Côn or an assistant changes itself and the brain (assistants, skills, workflows, loops, memory) with backup and undo, changes AI Việt Côn's own code through GitHub, then updates to the new release. Only the owner's own sessions see this tool."
