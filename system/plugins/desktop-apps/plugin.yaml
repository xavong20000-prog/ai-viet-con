name: Điều khiển app trên máy
name_en: "Control apps on this computer"
slug: desktop-apps
version: 1.0.0
description: Mở, đóng và liệt kê ứng dụng trên CHÍNH MÁY đang chạy AI Việt Côn (Windows, macOS, Linux có màn hình) theo lời người dùng, ví dụ "mở Chrome", "tắt Excel", "đang mở app nào". Tự chặn và nói rõ khi AI Việt Côn chạy trong Docker trên máy chủ, vì khi đó máy chạy AI Việt Côn không phải máy của người dùng.
description_en: "Opens, closes and lists apps on THE MACHINE running AI Việt Côn (Windows, macOS, Linux with a screen) when you ask, e.g. \"open Chrome\", \"close Excel\", \"which apps are open\". Blocks itself and says so when AI Việt Côn runs in Docker on a server, because then the machine running AI Việt Côn is not yours."
author: AI Việt Côn (bundled)
enabled: true
min_mode: safe
tools:
  - javis_app_list
  - javis_app_open
  - javis_app_close
hooks: []
